<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbook de Implantação ADP — M&A | Sonova RH/DP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0083CA; --dk:#003C64; --md:#005A64; --lt:#6EB4DC;
  --ac:#7D0041; --ac2:#8C321E; --tx:#333333; --mu:#646464;
  --bd:#CCCCCC; --bg:#F4F6F9; --card:#FFFFFF;
  --ok:#2E7D32; --warn:#E65100; --err:#C62828; --na:#9E9E9E;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 8px 28px rgba(0,60,100,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Roboto',sans-serif;font-weight:300;color:var(--tx);
  background:var(--bg);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Rufina',serif;font-weight:700;color:var(--dk);line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--tx)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c2cdd6;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#a7b6c2}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:60;background:var(--p);color:#fff;
  height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;
  box-shadow:0 2px 10px rgba(0,60,100,.25);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.wave{display:flex;align-items:flex-end;gap:2px;height:22px}
.wave span{width:3px;background:#fff;border-radius:2px;opacity:.92;animation:w 1.6s ease-in-out infinite}
.wave span:nth-child(1){height:7px;animation-delay:0s}
.wave span:nth-child(2){height:14px;animation-delay:.15s}
.wave span:nth-child(3){height:22px;animation-delay:.3s}
.wave span:nth-child(4){height:12px;animation-delay:.45s}
.wave span:nth-child(5){height:18px;animation-delay:.6s}
.wave span:nth-child(6){height:8px;animation-delay:.75s}
@keyframes w{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.brand h1{color:#fff;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:10.5px;font-weight:300;opacity:.85;letter-spacing:.4px;text-transform:uppercase}
.spacer{flex:1}
.hbtn{
  background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);
  padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:400;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn svg{width:15px;height:15px;fill:currentColor}

/* ===== AQUISIÇÃO BAR ===== */
.aqbar{
  background:var(--dk);color:#fff;display:flex;align-items:center;gap:14px;
  padding:8px 18px;flex-wrap:wrap;
}
.aqbar label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.75}
.aqsel{
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);
  padding:6px 10px;border-radius:7px;font-size:13px;font-weight:400;min-width:200px;
}
.aqsel option{color:#333}
.aqmeta{font-size:12px;opacity:.85;display:flex;gap:14px;flex-wrap:wrap}
.aqmeta b{font-weight:500;color:var(--lt)}
.prog-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;justify-content:flex-end}
.prog-track{flex:1;max-width:320px;height:9px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--lt),#fff);border-radius:6px;width:0;transition:width .5s ease}
.prog-pct{font-size:13px;font-weight:500;min-width:42px;text-align:right}
.iconbtn-d{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.iconbtn-d:hover{background:rgba(255,255,255,.26)}
.iconbtn-d svg{width:16px;height:16px;fill:currentColor}

/* ===== TOOLBAR ===== */
.toolbar{
  background:#fff;border-bottom:1px solid var(--bd);padding:9px 18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:58px;z-index:50;
}
.modes{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:9px;border:1px solid var(--bd)}
.mode{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mu);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.mode svg{width:15px;height:15px;fill:currentColor}
.mode.active{background:var(--p);color:#fff;box-shadow:var(--shadow)}
.mode:not(.active):hover{background:#e8edf2;color:var(--dk)}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.search input:focus{outline:none;border-color:var(--p);background:#fff}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--mu)}
.filtsel{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:12.5px;color:var(--tx);max-width:150px}
.filtsel:focus{outline:none;border-color:var(--p)}
.tb-btn{padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--dk);transition:.15s}
.tb-btn:hover{background:var(--bg);border-color:var(--p)}
.tb-btn.solid{background:var(--p);color:#fff;border-color:var(--p)}
.tb-btn.solid:hover{background:#006fa8}
.tb-btn svg{width:15px;height:15px;fill:currentColor}

/* ===== LAYOUT ===== */
.layout{display:flex;align-items:flex-start;gap:0}
.sidebar{
  width:262px;flex-shrink:0;background:#fff;border-right:1px solid var(--bd);
  padding:14px 10px;position:sticky;top:108px;height:calc(100vh - 108px);overflow-y:auto;
}
.side-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);padding:4px 10px 10px;font-weight:500}
.phase-link{
  display:block;padding:10px 12px;border-radius:9px;margin-bottom:5px;cursor:pointer;
  border:1px solid transparent;transition:.15s;position:relative;
}
.phase-link:hover{background:var(--bg)}
.phase-link.active{background:#eaf4fb;border-color:#bfe0f4}
.pl-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.pl-num{width:24px;height:24px;border-radius:7px;background:var(--p);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Rufina',serif}
.phase-link.active .pl-num{background:var(--dk)}
.pl-name{font-size:12.5px;font-weight:500;color:var(--dk);line-height:1.25}
.pl-bar{height:5px;background:#e8edf2;border-radius:4px;overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .4s}
.pl-stat{font-size:10.5px;color:var(--mu);margin-top:4px;display:flex;justify-content:space-between}

.main{flex:1;min-width:0;padding:20px 22px 60px}

/* ===== PHASE HEADER ===== */
.phase-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #e8edf2}
.ph-badge{width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--dk));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow)}
.ph-badge .n{font-family:'Rufina',serif;font-size:22px;font-weight:700;line-height:1}
.ph-badge .l{font-size:8px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;margin-top:2px}
.ph-info{flex:1;min-width:0}
.ph-info h2{font-size:21px;margin-bottom:4px}
.ph-info .desc{color:var(--mu);font-size:13px;max-width:780px}
.ph-info .meta{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.ph-info .meta b{color:var(--dk);font-weight:500}

/* ===== CARDS ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--p);
  border-radius:11px;padding:14px 15px;box-shadow:var(--shadow);transition:.18s;
  display:flex;flex-direction:column;gap:9px;position:relative;
}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card.done{opacity:.72;border-left-color:var(--ok)}
.card.done .c-title{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.card.blocked{border-left-color:var(--err)}
.card.na{opacity:.55;border-left-color:var(--na)}
.c-head{display:flex;align-items:flex-start;gap:8px}
.c-title{font-size:13.5px;font-weight:500;color:var(--dk);line-height:1.35;flex:1;outline:none;border-radius:4px;padding:1px 3px;margin:-1px -3px}
.c-title:focus{background:#eaf4fb;box-shadow:0 0 0 2px #bfe0f4}
.c-detail{font-size:12px;color:var(--mu);line-height:1.45;outline:none;border-radius:4px;padding:2px 3px;margin:-2px -3px;white-space:pre-wrap}
.c-detail:focus{background:#f7f9fb;box-shadow:0 0 0 2px #e0e8ef}
.c-detail.empty:before{content:'+ adicionar detalhe';color:#b0bcc6;font-style:italic}
.badges{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;color:#fff;letter-spacing:.2px;white-space:nowrap}
.badge.outline{background:#fff;border:1.3px solid;}
.crit-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.adp-path{
  font-size:11px;background:#f2f7fb;border:1px solid #d8e8f3;border-radius:7px;
  padding:6px 9px;color:var(--dk);display:flex;gap:6px;align-items:flex-start;line-height:1.4;
}
.adp-path svg{width:13px;height:13px;fill:var(--p);flex-shrink:0;margin-top:1px}
.adp-path .trail{font-family:'Roboto Mono',monospace;font-weight:400;word-break:break-word}
.lesson{
  font-size:11px;background:#fdf3e7;border:1px solid #f5d9b3;border-radius:7px;
  padding:6px 9px;color:#7a4a16;display:flex;gap:6px;align-items:flex-start;line-height:1.4;
}
.lesson svg{width:13px;height:13px;fill:var(--warn);flex-shrink:0;margin-top:1px}
.c-foot{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.statussel{font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:7px;border:1.3px solid;background:#fff;cursor:pointer}
.respchip{font-size:11px;color:var(--mu);display:inline-flex;align-items:center;gap:4px;background:var(--bg);padding:4px 8px;border-radius:7px;border:1px solid var(--bd)}
.respchip svg{width:12px;height:12px;fill:var(--mu)}
.respchip input{border:none;background:none;width:74px;outline:none;font-size:11px;color:var(--dk)}
.c-actions{display:flex;gap:4px;margin-left:auto}
.mini{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);transition:.15s;border:1px solid transparent}
.mini:hover{background:var(--bg);color:var(--dk)}
.mini.del:hover{background:#fdecea;color:var(--err);border-color:#f5c6c0}
.mini svg{width:15px;height:15px;fill:currentColor}
.note-line{display:none;font-size:11.5px;color:var(--tx);background:#fffef5;border:1px dashed #e0d9a8;border-radius:7px;padding:6px 9px;outline:none}
.note-line.show{display:block}
.note-line:focus{background:#fff;border-style:solid;border-color:var(--p)}
.note-line.empty:before{content:'Nota desta aquisição...';color:#b8b08a;font-style:italic}

.add-card{
  border:2px dashed var(--bd);border-radius:11px;padding:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--mu);cursor:pointer;transition:.18s;
  min-height:120px;font-size:13px;font-weight:500;
}
.add-card:hover{border-color:var(--p);color:var(--p);background:#f5fafd}
.add-card svg{width:26px;height:26px;fill:currentColor}

/* ===== KANBAN ===== */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{min-width:300px;max-width:320px;flex:1;background:#fff;border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.kcol-head{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px;border-radius:12px 12px 0 0;position:sticky;top:0;background:#fff;z-index:2}
.kcol-head .dot{width:11px;height:11px;border-radius:50%}
.kcol-head .ktitle{font-family:'Rufina',serif;font-weight:700;font-size:14px;color:var(--dk)}
.kcol-head .kcount{margin-left:auto;font-size:12px;font-weight:500;color:var(--mu);background:var(--bg);padding:2px 9px;border-radius:12px}
.kcol-body{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px;min-height:60px}
.kcol-body.drag-over{background:#eaf4fb}
.kcard{background:#fff;border:1px solid var(--bd);border-left:3px solid var(--p);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab;transition:.15s}
.kcard:hover{box-shadow:var(--shadow-lg)}
.kcard.dragging{opacity:.4}
.kcard .kc-phase{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--p);font-weight:500;margin-bottom:4px}
.kcard .kc-title{font-size:12.5px;font-weight:500;color:var(--dk);line-height:1.3}
.kcard .kc-badges{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}

/* ===== REPOS ===== */
.repo-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.repo-tab{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mu);border:1px solid var(--bd);background:#fff;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.repo-tab svg{width:15px;height:15px;fill:currentColor}
.repo-tab.active{background:var(--dk);color:#fff;border-color:var(--dk)}
.repo-tab:not(.active):hover{border-color:var(--p);color:var(--dk)}
.dtable{width:100%;border-collapse:collapse;background:#fff;border-radius:11px;overflow:hidden;box-shadow:var(--shadow);font-size:12.5px}
.dtable th{background:var(--p);color:#fff;text-align:left;padding:11px 13px;font-weight:500;font-size:12px;letter-spacing:.3px}
.dtable td{padding:9px 13px;border-bottom:1px solid #eef2f5;vertical-align:top}
.dtable tr:last-child td{border-bottom:none}
.dtable tr:hover td{background:#f7fafc}
.dtable td[contenteditable]{outline:none}
.dtable td[contenteditable]:focus{background:#eaf4fb;box-shadow:inset 0 0 0 2px #bfe0f4}
.dtable .vcode{font-family:'Roboto Mono',monospace;font-weight:500;color:var(--ac);background:#fbeef4;padding:2px 7px;border-radius:5px;display:inline-block}
.rowdel{color:var(--mu);width:30px;text-align:center}
.rowdel button{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#b0bcc6;transition:.15s}
.rowdel button:hover{background:#fdecea;color:var(--err)}
.rowdel svg{width:14px;height:14px;fill:currentColor}
.addrow{margin-top:12px;padding:9px 16px;border:1px dashed var(--bd);border-radius:9px;color:var(--mu);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.addrow:hover{border-color:var(--p);color:var(--p)}
.addrow svg{width:15px;height:15px;fill:currentColor}

.lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.lcard{background:#fff;border:1px solid var(--bd);border-top:4px solid var(--warn);border-radius:11px;padding:15px;box-shadow:var(--shadow);position:relative}
.lcard h4{font-size:14px;color:var(--ac2);margin-bottom:9px;padding-right:24px;outline:none}
.lcard h4:focus{background:#eaf4fb;border-radius:4px}
.lcard .lrow{margin-bottom:9px}
.lcard .llabel{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:500;display:block;margin-bottom:3px}
.lcard .ltext{font-size:12.5px;color:var(--tx);line-height:1.45;outline:none;border-radius:4px;padding:3px 5px;margin:-3px -5px}
.lcard .ltext:focus{background:#f7f9fb;box-shadow:0 0 0 2px #e0e8ef}
.lcard .ldel{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:6px;color:#b0bcc6;display:inline-flex;align-items:center;justify-content:center}
.lcard .ldel:hover{background:#fdecea;color:var(--err)}
.lcard .ldel svg{width:14px;height:14px;fill:currentColor}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(0,30,50,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:15px;width:100%;max-width:460px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{background:var(--p);color:#fff;padding:15px 20px;display:flex;align-items:center;gap:10px}
.modal-head h3{color:#fff;font-size:16px}
.modal-head svg{width:19px;height:19px;fill:#fff}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:500;color:var(--dk)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--p)}
.fld textarea{resize:vertical;min-height:60px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:flex-end}
.mbtn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;transition:.15s}
.mbtn.ghost{background:#fff;border:1px solid var(--bd);color:var(--mu)}
.mbtn.ghost:hover{background:var(--bg)}
.mbtn.primary{background:var(--p);color:#fff}
.mbtn.primary:hover{background:#006fa8}
.mbtn.danger{background:var(--err);color:#fff}
.mbtn.danger:hover{background:#a81f17}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--dk);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:400;box-shadow:var(--shadow-lg);z-index:200;transition:transform .3s ease;display:flex;align-items:center;gap:9px;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;fill:var(--lt)}

/* ===== FOOTER ===== */
.foot{background:var(--p);color:#fff;text-align:center;padding:11px;font-size:11.5px;letter-spacing:.4px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.foot .pg{opacity:.8}

.empty-state{text-align:center;padding:60px 20px;color:var(--mu)}
.empty-state svg{width:48px;height:48px;fill:#c2cdd6;margin-bottom:14px}
.empty-state h3{color:var(--mu);font-size:16px;margin-bottom:6px}

.hide{display:none!important}

/* RESPONSIVE */
.menu-toggle{display:none}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:90;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);padding-top:18px}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:inline-flex}
  .brand h1{font-size:14.5px}
  .brand .sub{display:none}
  .main{padding:16px 14px 50px}
  .cards{grid-template-columns:1fr}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:85}
  .backdrop.show{display:block}
}
@media(min-width:901px){.menu-toggle{display:none}}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <button class="menu-toggle hbtn" id="menuToggle" title="Menu de fases">

    {titulo:'Data-limite de adiantamento', erro:'Incorporação altera a data-limite de adiantamento das adquiridas.', fix:'Alinhar a data-limite com o financeiro antes do primeiro fechamento.'},
  ]
};

/* CNPJs do cluster (referência rápida em nova aquisição) */
const CLUSTER_CNPJS = [
  'Sonova 92.792.530/0001-38','AB 13.059.106/0001-02','AR 09.100.583/0001-05',
  'Uniaudio 12.019.353/0001-12','Conect 12.831.919/0001-06','AudioClin 17.912.157/0001-96'
];
</script>

<script>
/* ============================================================
   APP LOGIC — Playbook de Implantação ADP (M&A) | Sonova RH/DP
   Estado em localStorage; sem dependências externas.
   ============================================================ */

/* ---------- Ícones (SVG inline reutilizáveis) ---------- */
const IC = {
  trash:'<svg viewBox="0 0 24 24"><path d="M9 3v1H4v2h16V4h-5V3H9M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7H5m4 3h2v8H9v-8m4 0h2v8h-2v-8Z"/></svg>',
  note:'<svg viewBox="0 0 24 24"><path d="M20.71 7.04c.39-.39.39-1.04 0-1.41l-2.34-2.34c-.37-.39-1.02-.39-1.41 0l-1.84 1.83 3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75L3 17.25Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z"/></svg>',
  adp:'<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2Z"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M13 14h-2V9h2m0 9h-2v-2h2M1 21h22L12 2 1 21Z"/></svg>',
  user:'<svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4Z"/></svg>',
  forn:'<svg viewBox="0 0 24 24"><path d="M3 3h18v4H3V3m0 6h18v12H3V9m9 2H7v4h5v-4Z"/></svg>',
  verba:'<svg viewBox="0 0 24 24"><path d="M5 6h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2m7 3a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3Z"/></svg>',
  route:'<svg viewBox="0 0 24 24"><path d="M11 10H5L3 8l2-2h6V3l1-1 1 1v3h6l2 2-2 2h-6v4h4l2 2-2 2h-4v3l-1 1-1-1v-3H7l-2-2 2-2h4v-4Z"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2M6 4h5v8l-2.5-1.5L6 12V4Z"/></svg>',
  aq:'<svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2M4 11v8H2v2h20v-2h-2v-8h-2v8h-3v-8h-2v8h-2v-8H7v8H4v-8H4Z"/></svg>',
};

/* ---------- Utilitários ---------- */
const $  = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => (typeof structuredClone==='function') ? structuredClone(o) : JSON.parse(JSON.stringify(o));
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtData(iso){ if(!iso) return '—'; const p=String(iso).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }

let toastTimer=null;
function toast(msg){
  $('toastMsg').textContent=msg;
  const t=$('toast'); t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------- IDs determinísticos do playbook mestre ---------- */
function seedIds(master){
  master.forEach(fase=>{
    if(!fase.id) fase.id='f'+uid().slice(0,6);
    (fase.acoes||[]).forEach((a,i)=>{ if(!a.id) a.id = fase.id+'_a'+i; });
  });
  return master;
}

/* ---------- Estado / persistência ---------- */
let MASTER, REPOS, AQS, UI;

function load(key){
  try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }
}
function persist(key,val){
  try{ localStorage.setItem(key,JSON.stringify(val)); }
  catch(e){ toast('Falha ao salvar (armazenamento cheio?)'); }
}
const saveMaster = ()=>persist(LS_MASTER,MASTER);
const saveRepos  = ()=>persist(LS_REPO,REPOS);
const saveAqs    = ()=>persist(LS_AQ,AQS);
const saveUi     = ()=>persist(LS_UI,UI);

function bootState(){
  MASTER = load(LS_MASTER);
  if(!Array.isArray(MASTER) || !MASTER.length){ MASTER = seedIds(clone(DEFAULT_PLAYBOOK)); saveMaster(); }
  else seedIds(MASTER);

  REPOS = load(LS_REPO);
  if(!REPOS || typeof REPOS!=='object'){ REPOS = clone(DEFAULT_REPOS); saveRepos(); }
  ['fornecedores','verbas','caminhos','licoes'].forEach(k=>{ if(!Array.isArray(REPOS[k])) REPOS[k]=clone(DEFAULT_REPOS[k]||[]); });

  AQS = load(LS_AQ);
  if(!Array.isArray(AQS) || !AQS.length){
    AQS = [{ id:uid(), nome:'Aquisição 1', cnpj:'', inicio:todayISO(), status:{} }];
    saveAqs();
  }
  AQS.forEach(a=>{ if(!a.status) a.status={}; });

  UI = load(LS_UI) || {};
  if(!UI.mode) UI.mode='fases';
  if(!UI.repoTab) UI.repoTab='fornecedores';
  if(!UI.aqId || !AQS.some(a=>a.id===UI.aqId)) UI.aqId=AQS[0].id;
  if(!UI.activePhase || !MASTER.some(f=>f.id===UI.activePhase)) UI.activePhase=MASTER[0].id;
  saveUi();
}

/* ---------- Helpers de domínio ---------- */
const activeAq = ()=>AQS.find(a=>a.id===UI.aqId) || AQS[0];
function stOf(actionId){
  const aq=activeAq(); const rec=aq.status[actionId];
  return rec || {st:'pendente',nota:''};
}
function setSt(actionId,st){
  const aq=activeAq();
  const rec=aq.status[actionId] || {st:'pendente',nota:''};
  rec.st=st; aq.status[actionId]=rec; saveAqs();
}
function setNota(actionId,nota){
  const aq=activeAq();
  const rec=aq.status[actionId] || {st:'pendente',nota:''};
  rec.nota=nota; aq.status[actionId]=rec; saveAqs();
}
const faseById = id => MASTER.find(f=>f.id===id);
function findAction(actionId){
  for(const f of MASTER){ const a=(f.acoes||[]).find(x=>x.id===actionId); if(a) return {fase:f,acao:a}; }
  return null;
}
function phaseProgress(fase){
  const acts=fase.acoes||[];
  const aq=activeAq();
  let done=0, denom=0;
  acts.forEach(a=>{ const s=(aq.status[a.id]||{}).st||'pendente'; if(s==='na')return; denom++; if(s==='concluido')done++; });
  return {done, denom, pct: denom? Math.round(done/denom*100):0, total:acts.length};
}
function overallProgress(){
  let done=0, denom=0, total=0;
  const aq=activeAq();
  MASTER.forEach(f=>(f.acoes||[]).forEach(a=>{
    total++;
    const s=(aq.status[a.id]||{}).st||'pendente';
    if(s==='na')return; denom++; if(s==='concluido')done++;
  }));
  return {done, denom, total, pct: denom? Math.round(done/denom*100):0};
}

/* ---------- Filtros ---------- */
function filters(){
  return {
    q: ($('searchInput').value||'').trim().toLowerCase(),
    cat: $('filtCat').value||'',
    status: $('filtStatus').value||''
  };
}
function matchAction(fase,a){
  const f=filters();
  if(f.cat && a.cat!==f.cat) return false;
  if(f.status){ const s=stOf(a.id).st; if(s!==f.status) return false; }
  if(f.q){
    const hay=[a.titulo,a.detalhe,a.adp,a.licao,a.resp,fase.nome].join(' ').toLowerCase();
    if(!hay.includes(f.q)) return false;
  }
  return true;
}

/* ============================================================
   RENDER — Seletor de aquisição + progresso + rodapé
   ============================================================ */
function renderAqSelector(){
  const sel=$('aqSelect');
  sel.innerHTML = AQS.map(a=>`<option value="${esc(a.id)}"${a.id===UI.aqId?' selected':''}>${esc(a.nome)}</option>`).join('');
  const aq=activeAq();
  const op=overallProgress();
  const parts=[];
  if(aq.cnpj) parts.push(`CNPJ ${esc(aq.cnpj)}`);
  parts.push(`Início ${fmtData(aq.inicio)}`);
  parts.push(`${op.done}/${op.denom} concluídas`);
  $('aqMeta').innerHTML = parts.join(' &nbsp;·&nbsp; ');
}
function renderProgress(){
  const op=overallProgress();
  $('progFill').style.width=op.pct+'%';
  $('progPct').textContent=op.pct+'%';
}
function renderFooter(){
  let total=0; MASTER.forEach(f=>total+=(f.acoes||[]).length);
  $('totAcoes').textContent=total;
}

/* ---------- Sidebar (lista de fases) ---------- */
function renderSidebar(){
  const wrap=$('phaseList');
  wrap.innerHTML = MASTER.map(f=>{
    const p=phaseProgress(f);
    const active = (UI.mode==='fases' && f.id===UI.activePhase && !filters().q);
    return `<div class="phase-link${active?' active':''}" data-fase="${esc(f.id)}">
      <div class="pl-top"><span class="pl-num">${f.num??''}</span><span class="pl-name">${esc(f.nome)}</span></div>
      <div class="pl-bar"><i style="width:${p.pct}%"></i></div>
      <div class="pl-stat"><span>${p.done} de ${p.denom||p.total}</span><span>${p.pct}%</span></div>
    </div>`;
  }).join('') +
  `<div class="phase-link" id="addPhaseBtn" style="text-align:center;color:var(--mu);border:1px dashed var(--bd);margin-top:8px">
     <span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500">${IC.plus} Nova fase</span>
   </div>`;

  wrap.querySelectorAll('.phase-link[data-fase]').forEach(el=>{
    el.addEventListener('click',()=>{
      UI.activePhase=el.dataset.fase; UI.mode='fases'; saveUi();
      $('searchInput').value='';
      setMode('fases');
      closeSidebarMobile();
    });
  });
  $('addPhaseBtn').addEventListener('click',openAddPhase);
}

/* ============================================================
   RENDER — Visão FASES (cards)
   ============================================================ */
function cardHTML(fase,a){
  const cat=CATS[a.cat]||{nome:a.cat||'—',cor:'#646464'};
  const crit=CRIT[a.crit]||{nome:a.crit||'—',cor:'#646464'};
  const rec=stOf(a.id);
  const st=rec.st||'pendente';
  const stMeta=STATUS[st]||STATUS.pendente;
  const cls = st==='concluido'?'done':st==='bloqueado'?'blocked':st==='na'?'na':'';
  const opts=STATUS_ORDER.map(k=>`<option value="${k}"${k===st?' selected':''}>${esc(STATUS[k].nome)}</option>`).join('');
  const hasNota=!!(rec.nota&&rec.nota.trim());

  return `<div class="card ${cls}" data-id="${esc(a.id)}" data-fase="${esc(fase.id)}">
    <div class="c-head">
      <div class="c-title" contenteditable spellcheck="false" data-f="titulo">${esc(a.titulo)}</div>
      <div class="c-actions">
        <span class="mini note-toggle" title="Nota desta aquisição">${IC.note}</span>
        <span class="mini del" title="Excluir ação">${IC.trash}</span>
      </div>
    </div>
    <div class="c-detail${a.detalhe?'':' empty'}" contenteditable spellcheck="false" data-f="detalhe">${esc(a.detalhe||'')}</div>
    <div class="badges">
      <span class="badge" style="background:${cat.cor}">${esc(cat.nome)}</span>
      <span class="badge outline" style="color:${crit.cor};border-color:${crit.cor}">${esc(crit.nome)}</span>
    </div>
    ${a.adp?`<div class="adp-path">${IC.adp}<span class="trail" contenteditable spellcheck="false" data-f="adp">${esc(a.adp)}</span></div>`:''}
    ${a.licao?`<div class="lesson">${IC.warn}<span contenteditable spellcheck="false" data-f="licao" style="outline:none">${esc(a.licao)}</span></div>`:''}
    <div class="c-foot">
      <select class="statussel" style="color:${stMeta.cor};border-color:${stMeta.cor}">${opts}</select>
      <span class="respchip">${IC.user}<input type="text" value="${esc(a.resp||'')}" placeholder="Responsável" data-f="resp"></span>
    </div>
    <div class="note-line${hasNota?' show':''}${hasNota?'':' empty'}" contenteditable spellcheck="false" data-f="nota">${esc(rec.nota||'')}</div>
  </div>`;
}

function phaseBlockHTML(fase,showAdd){
  const p=phaseProgress(fase);
  const visibles=(fase.acoes||[]).filter(a=>matchAction(fase,a));
  const cards=visibles.map(a=>cardHTML(fase,a)).join('');
  const addCard = showAdd ? `<div class="add-card" data-add="${esc(fase.id)}">${IC.plus}<span>Adicionar ação</span></div>` : '';
  return `<section data-phase-block="${esc(fase.id)}">
    <div class="phase-head">
      <div class="ph-badge"><span class="n">${fase.num??''}</span><span class="l">${esc(fase.label||'')}</span></div>
      <div class="ph-info">
        <h2>${esc(fase.nome)}</h2>
        <div class="desc">${esc(fase.desc||'')}</div>
        <div class="meta">
          <span><b>${(fase.acoes||[]).length}</b> ações</span>
          <span><b>${p.done}</b> concluídas</span>
          <span><b>${p.pct}%</b> da fase</span>
        </div>
      </div>
    </div>
    <div class="cards">${cards}${addCard}</div>
  </section>`;
}

function renderFases(){
  const view=$('viewFases');
  const q=filters().q;
  let html='';

  if(q){
    // Busca: percorre todas as fases, exibindo só as que têm correspondência
    const blocks=MASTER.filter(f=>(f.acoes||[]).some(a=>matchAction(f,a)))
                       .map(f=>phaseBlockHTML(f,false)).join('');
    html = blocks || emptyState('Nenhuma ação encontrada para o filtro atual.');
  }else{
    const fase=faseById(UI.activePhase)||MASTER[0];
    html = phaseBlockHTML(fase,true);
  }
  view.innerHTML=html;
  bindCardEvents(view);
}

function emptyState(msg){
  return `<div class="empty-state">${IC.book}<h3>Sem resultados</h3><p>${esc(msg)}</p></div>`;
}

/* ---------- Eventos dos cards ---------- */
function bindCardEvents(scope){
  // edição de campos do mestre (titulo/detalhe/adp/licao/resp)
  scope.querySelectorAll('[data-f]').forEach(el=>{
    const field=el.dataset.f;
    const card=el.closest('.card'); if(!card) return;
    const id=card.dataset.id;

    if(field==='resp'){
      el.addEventListener('change',()=>{ const r=findAction(id); if(r){ r.acao.resp=el.value.trim(); saveMaster(); } });
      el.addEventListener('blur',()=>{ const r=findAction(id); if(r){ r.acao.resp=el.value.trim(); saveMaster(); } });
      return;
    }
    if(field==='nota'){
      el.addEventListener('blur',()=>{
        const txt=el.innerText.replace(/\u00a0/g,' ').trim();
        setNota(id,txt);
        el.classList.toggle('empty',!txt);
      });
      return;
    }
    // campos do mestre (contenteditable)
    el.addEventListener('blur',()=>{
      let txt=el.innerText.replace(/\u00a0/g,' ');
      txt = (field==='detalhe'||field==='licao') ? txt.replace(/\n{3,}/g,'\n\n').trim() : txt.replace(/\n/g,' ').trim();
      const r=findAction(id); if(!r) return;
      r.acao[field]=txt;
      saveMaster();
      if(field==='detalhe') el.classList.toggle('empty',!txt);
    });
  });

  // status
  scope.querySelectorAll('.statussel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const card=sel.closest('.card'); const id=card.dataset.id;
      setSt(id,sel.value);
      const meta=STATUS[sel.value]||STATUS.pendente;
      sel.style.color=meta.cor; sel.style.borderColor=meta.cor;
      card.classList.remove('done','blocked','na');
      if(sel.value==='concluido')card.classList.add('done');
      else if(sel.value==='bloqueado')card.classList.add('blocked');
      else if(sel.value==='na')card.classList.add('na');
      renderSidebar(); renderProgress(); renderAqSelector();
    });
  });

  // toggle nota
  scope.querySelectorAll('.note-toggle').forEach(b=>{
    b.addEventListener('click',()=>{
      const card=b.closest('.card');
      const note=card.querySelector('.note-line');
      note.classList.toggle('show');
      if(note.classList.contains('show')){ note.focus(); }
    });
  });

  // excluir ação
  scope.querySelectorAll('.mini.del').forEach(b=>{
    b.addEventListener('click',()=>{
      const card=b.closest('.card'); const id=card.dataset.id;
      const r=findAction(id); if(!r) return;
      confirmModal('Excluir ação','Remover esta ação do playbook? Ela sairá de todas as aquisições.',()=>{
        const arr=r.fase.acoes; const ix=arr.findIndex(x=>x.id===id);
        if(ix>=0)arr.splice(ix,1);
        AQS.forEach(a=>{ delete a.status[id]; });
        saveMaster(); saveAqs();
        renderActiveView(); renderSidebar(); renderProgress(); renderAqSelector(); renderFooter();
        toast('Ação removida');
      });
    });
  });

  // adicionar ação
  scope.querySelectorAll('.add-card').forEach(b=>{
    b.addEventListener('click',()=>openAddAction(b.dataset.add));
  });
}

/* ============================================================
   RENDER — Visão KANBAN
   ============================================================ */
function renderKanban(){
  const view=$('viewKanban');
  const f=filters();
  // coleta ações que passam por busca + categoria
  const items=[];
  MASTER.forEach(fase=>(fase.acoes||[]).forEach(a=>{
    if(f.cat && a.cat!==f.cat) return;
    if(f.q){
      const hay=[a.titulo,a.detalhe,a.adp,a.licao,a.resp,fase.nome].join(' ').toLowerCase();
      if(!hay.includes(f.q)) return;
    }
    items.push({fase,a,st:stOf(a.id).st||'pendente'});
  }));

  const cols=STATUS_ORDER.map(stKey=>{
    const meta=STATUS[stKey];
    const cards=items.filter(it=>it.st===stKey).map(it=>{
      const cat=CATS[it.a.cat]||{nome:it.a.cat||'—',cor:'#646464'};
      const crit=CRIT[it.a.crit]||{nome:it.a.crit||'',cor:'#646464'};
      return `<div class="kcard" draggable="true" data-id="${esc(it.a.id)}">
        <div class="kc-phase">Fase ${it.fase.num} · ${esc(it.fase.label||'')}</div>
        <div class="kc-title">${esc(it.a.titulo)}</div>
        <div class="kc-badges">
          <span class="badge" style="background:${cat.cor}">${esc(cat.nome)}</span>
          <span class="badge outline" style="color:${crit.cor};border-color:${crit.cor}">${esc(crit.nome)}</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="kcol" data-status="${stKey}">
      <div class="kcol-head"><span class="dot" style="background:${meta.cor}"></span><span class="ktitle">${esc(meta.nome)}</span><span class="kcount">${items.filter(it=>it.st===stKey).length}</span></div>
      <div class="kcol-body" data-status="${stKey}">${cards}</div>
    </div>`;
  }).join('');

  view.innerHTML=`<div class="kanban">${cols}</div>`;
  bindKanban(view);
}

function bindKanban(scope){
  let dragId=null;
  scope.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{ dragId=card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>{ dragId=null; card.classList.remove('dragging'); scope.querySelectorAll('.kcol-body').forEach(b=>b.classList.remove('drag-over')); });
  });
  scope.querySelectorAll('.kcol-body').forEach(body=>{
    body.addEventListener('dragover',e=>{ e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
    body.addEventListener('drop',e=>{
      e.preventDefault(); body.classList.remove('drag-over');
      if(!dragId) return;
      const newSt=body.dataset.status;
      setSt(dragId,newSt);
      renderKanban(); renderSidebar(); renderProgress(); renderAqSelector();
    });
  });
}

/* ============================================================
   RENDER — Visão BASES (repositórios editáveis)
   ============================================================ */
const REPO_TABS=[
  {key:'fornecedores',nome:'Fornecedores',ic:IC.forn},
  {key:'verbas',nome:'Verbas ADP',ic:IC.verba},
  {key:'caminhos',nome:'Caminhos ADP',ic:IC.route},
  {key:'licoes',nome:'Lições aprendidas',ic:IC.book},
];

function renderRepos(){
  const view=$('viewRepos');
  const tabs=REPO_TABS.map(t=>`<button class="repo-tab${t.key===UI.repoTab?' active':''}" data-tab="${t.key}">${t.ic}${esc(t.nome)}</button>`).join('');
  view.innerHTML=`<div class="repo-tabs">${tabs}</div><div id="repoBody"></div>`;
  view.querySelectorAll('.repo-tab').forEach(b=>b.addEventListener('click',()=>{ UI.repoTab=b.dataset.tab; saveUi(); renderRepos(); }));
  renderRepoBody();
}

function rowFilter(rowObj){
  const q=filters().q; if(!q) return true;
  return Object.values(rowObj).join(' ').toLowerCase().includes(q);
}

function renderRepoBody(){
  const body=$('repoBody'); const tab=UI.repoTab;
  if(tab==='licoes'){ renderLessons(body); return; }

  let cols, rowsHTML;
  if(tab==='fornecedores'){
    cols=['Fornecedor','Serviço','Contato','Telefone','E-mail','Observações'];
    const fkeys=['nome','servico','contato','tel','email','obs'];
    rowsHTML=REPOS.fornecedores.map((r,i)=>rowFilter(r)?`<tr data-i="${i}">${
      fkeys.map(k=>`<td contenteditable spellcheck="false" data-k="${k}">${esc(r[k]||'')}</td>`).join('')
    }<td class="rowdel"><button title="Excluir">${IC.trash}</button></td></tr>`:'').join('');
  }else if(tab==='verbas'){
    cols=['Código','Descrição','Tipo','Incidências','Observações'];
    const vkeys=['cod','desc','tipo','inc','obs'];
    rowsHTML=REPOS.verbas.map((r,i)=>rowFilter(r)?`<tr data-i="${i}">${
      vkeys.map(k=> k==='cod'
        ? `<td><span class="vcode" contenteditable spellcheck="false" data-k="cod">${esc(r.cod||'')}</span></td>`
        : `<td contenteditable spellcheck="false" data-k="${k}">${esc(r[k]||'')}</td>`).join('')
    }<td class="rowdel"><button title="Excluir">${IC.trash}</button></td></tr>`:'').join('');
  }else{ // caminhos
    cols=['Ação','Trilha de menus ADP'];
    rowsHTML=REPOS.caminhos.map((r,i)=>rowFilter(r)?`<tr data-i="${i}">
      <td contenteditable spellcheck="false" data-k="acao" style="font-weight:500;color:var(--dk);min-width:150px">${esc(r.acao||'')}</td>
      <td contenteditable spellcheck="false" data-k="trail" style="font-family:'Roboto Mono',monospace;font-size:11.5px">${esc(r.trail||'')}</td>
      <td class="rowdel"><button title="Excluir">${IC.trash}</button></td></tr>`:'').join('');
  }

  body.innerHTML=`<table class="dtable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th style="width:30px"></th></tr></thead>
    <tbody>${rowsHTML}</tbody></table>
    <button class="addrow" data-add="${tab}">${IC.plus} Adicionar linha</button>`;

  // edição de células
  body.querySelectorAll('td [data-k],td[data-k]').forEach(cell=>{
    cell.addEventListener('blur',()=>{
      const tr=cell.closest('tr'); const i=+tr.dataset.i; const k=cell.dataset.k;
      const txt=cell.innerText.replace(/\u00a0/g,' ').replace(/\n/g,' ').trim();
      if(REPOS[tab][i]){ REPOS[tab][i][k]=txt; saveRepos(); }
    });
  });
  // excluir linha
  body.querySelectorAll('.rowdel button').forEach(b=>{
    b.addEventListener('click',()=>{
      const tr=b.closest('tr'); const i=+tr.dataset.i;
      REPOS[tab].splice(i,1); saveRepos(); renderRepoBody(); toast('Linha removida');
    });
  });
  // adicionar linha
  body.querySelector('.addrow').addEventListener('click',()=>{
    const blanks={
      fornecedores:{nome:'',servico:'',contato:'',tel:'',email:'',obs:''},
      verbas:{cod:'',desc:'',tipo:'',inc:'—',obs:''},
      caminhos:{acao:'',trail:''}
    };
    REPOS[tab].push(clone(blanks[tab])); saveRepos(); renderRepoBody();
  });
}

function renderLessons(body){
  const cards=REPOS.licoes.map((l,i)=>rowFilter(l)?`<div class="lcard" data-i="${i}">
    <button class="ldel" title="Excluir">${IC.trash}</button>
    <h4 contenteditable spellcheck="false" data-k="titulo">${esc(l.titulo||'')}</h4>
    <div class="lrow"><span class="llabel">Erro / risco observado</span>
      <div class="ltext" contenteditable spellcheck="false" data-k="erro">${esc(l.erro||'')}</div></div>
    <div class="lrow"><span class="llabel">Como evitar / corrigir</span>
      <div class="ltext" contenteditable spellcheck="false" data-k="fix">${esc(l.fix||'')}</div></div>
  </div>`:'').join('');
  body.innerHTML=`<div class="lessons-grid">${cards}</div>
    <button class="addrow" data-add="licoes" style="margin-top:16px">${IC.plus} Adicionar lição</button>`;

  body.querySelectorAll('.lcard [data-k]').forEach(cell=>{
    cell.addEventListener('blur',()=>{
      const card=cell.closest('.lcard'); const i=+card.dataset.i; const k=cell.dataset.k;
      const txt=cell.innerText.replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim();
      if(REPOS.licoes[i]){ REPOS.licoes[i][k]=txt; saveRepos(); }
    });
  });
  body.querySelectorAll('.ldel').forEach(b=>{
    b.addEventListener('click',()=>{
      const i=+b.closest('.lcard').dataset.i;
      REPOS.licoes.splice(i,1); saveRepos(); renderRepoBody(); toast('Lição removida');
    });
  });
  body.querySelector('.addrow').addEventListener('click',()=>{
    REPOS.licoes.push({titulo:'Nova lição',erro:'',fix:''}); saveRepos(); renderRepoBody();
  });
}

/* ============================================================
   Modos / view switching
   ============================================================ */
function renderActiveView(){
  if(UI.mode==='fases')  renderFases();
  if(UI.mode==='kanban') renderKanban();
  if(UI.mode==='repos')  renderRepos();
}
function setMode(mode){
  UI.mode=mode; saveUi();
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  $('viewFases').classList.toggle('hide',mode!=='fases');
  $('viewKanban').classList.toggle('hide',mode!=='kanban');
  $('viewRepos').classList.toggle('hide',mode!=='repos');
  renderActiveView();
  renderSidebar();
}

function renderAll(){
  renderAqSelector();
  renderSidebar();
  renderProgress();
  renderFooter();
  setMode(UI.mode);
}

/* ============================================================
   MODAIS
   ============================================================ */
function openModal(html){ $('modal').innerHTML=html; $('overlay').classList.add('show'); }
function closeModal(){ $('overlay').classList.remove('show'); $('modal').innerHTML=''; }

function confirmModal(title,msg,onYes,danger){
  openModal(`<div class="modal-head">${IC.warn}<h3>${esc(title)}</h3></div>
    <div class="modal-body"><p style="font-size:13.5px;color:var(--tx);line-height:1.5">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="mbtn ghost" data-x>Cancelar</button>
      <button class="mbtn ${danger?'danger':'primary'}" data-yes>Confirmar</button>
    </div>`);
  $('modal').querySelector('[data-x]').onclick=closeModal;
  $('modal').querySelector('[data-yes]').onclick=()=>{ closeModal(); onYes&&onYes(); };
}

function openAddAction(faseId){
  const fase=faseById(faseId); if(!fase) return;
  const catOpts=Object.keys(CATS).map(k=>`<option value="${k}"${k===fase.acoes?.[0]?.cat?'':''}>${esc(CATS[k].nome)}</option>`).join('');
  const critOpts=Object.keys(CRIT).map(k=>`<option value="${k}"${k==='media'?' selected':''}>${esc(CRIT[k].nome)}</option>`).join('');
  openModal(`<div class="modal-head">${IC.plus}<h3>Nova ação — Fase ${fase.num}</h3></div>
    <div class="modal-body">
      <div class="fld"><label>Título da ação *</label><input id="na_tit" type="text" placeholder="Ex.: Validar CBO por função"></div>
      <div class="fld"><label>Detalhe</label><textarea id="na_det" placeholder="Descrição / instrução"></textarea></div>
      <div class="fld"><label>Categoria</label><select id="na_cat">${catOpts}</select></div>
      <div class="fld"><label>Criticidade</label><select id="na_crit">${critOpts}</select></div>
      <div class="fld"><label>Responsável (sugerido)</label><input id="na_resp" type="text" placeholder="Opcional"></div>
      <div class="fld"><label>Caminho ADP</label><input id="na_adp" type="text" placeholder="Folha > ... (opcional)"></div>
      <div class="fld"><label>Lição / atenção</label><textarea id="na_lic" placeholder="Armadilha conhecida (opcional)"></textarea></div>
    </div>
    <div class="modal-foot"><button class="mbtn ghost" data-x>Cancelar</button><button class="mbtn primary" data-ok>Adicionar</button></div>`);
  $('modal').querySelector('[data-x]').onclick=closeModal;
  $('modal').querySelector('[data-ok]').onclick=()=>{
    const tit=$('na_tit').value.trim(); if(!tit){ $('na_tit').focus(); return; }
    fase.acoes.push({ id:uid(), titulo:tit, detalhe:$('na_det').value.trim(), cat:$('na_cat').value,
      crit:$('na_crit').value, resp:$('na_resp').value.trim(), adp:$('na_adp').value.trim(), licao:$('na_lic').value.trim() });
    saveMaster(); closeModal();
    renderActiveView(); renderSidebar(); renderProgress(); renderFooter(); renderAqSelector();
    toast('Ação adicionada');
  };
  setTimeout(()=>$('na_tit').focus(),60);
}

function openAddPhase(){
  openModal(`<div class="modal-head">${IC.plus}<h3>Nova fase</h3></div>
    <div class="modal-body">
      <div class="fld"><label>Nome da fase *</label><input id="np_nome" type="text" placeholder="Ex.: Integração de Sistemas"></div>
      <div class="fld"><label>Rótulo curto (badge)</label><input id="np_label" type="text" placeholder="Ex.: Integra" maxlength="14"></div>
      <div class="fld"><label>Descrição</label><textarea id="np_desc" placeholder="O que esta fase cobre"></textarea></div>
    </div>
    <div class="modal-foot"><button class="mbtn ghost" data-x>Cancelar</button><button class="mbtn primary" data-ok>Criar fase</button></div>`);
  $('modal').querySelector('[data-x]').onclick=closeModal;
  $('modal').querySelector('[data-ok]').onclick=()=>{
    const nome=$('np_nome').value.trim(); if(!nome){ $('np_nome').focus(); return; }
    const num=Math.max(0,...MASTER.map(f=>f.num||0))+1;
    const fase={ id:'f'+uid().slice(0,6), num, nome, label:$('np_label').value.trim()||('F'+num),
      desc:$('np_desc').value.trim(), acoes:[] };
    MASTER.push(fase); saveMaster();
    UI.activePhase=fase.id; UI.mode='fases'; saveUi();
    closeModal(); setMode('fases');
    toast('Fase criada');
  };
  setTimeout(()=>$('np_nome').focus(),60);
}

function cnpjDatalist(){
  return `<datalist id="cnpjList">${CLUSTER_CNPJS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
}
function openAqModal(editing){
  const aq = editing ? activeAq() : null;
  openModal(`<div class="modal-head">${IC.aq}<h3>${editing?'Editar aquisição':'Nova aquisição'}</h3></div>
    <div class="modal-body">
      <div class="fld"><label>Nome da aquisição *</label><input id="aq_nome" type="text" placeholder="Ex.: Aquisição XYZ Audição" value="${aq?esc(aq.nome):''}"></div>
      <div class="fld"><label>CNPJ (referência)</label><input id="aq_cnpj" type="text" list="cnpjList" placeholder="00.000.000/0001-00" value="${aq?esc(aq.cnpj||''):''}">${cnpjDatalist()}</div>
      <div class="fld"><label>Início da implantação</label><input id="aq_inicio" type="date" value="${aq?esc(aq.inicio||todayISO()):todayISO()}"></div>
    </div>
    <div class="modal-foot">
      ${editing&&AQS.length>1?`<button class="mbtn danger" data-del style="margin-right:auto">Excluir</button>`:''}
      <button class="mbtn ghost" data-x>Cancelar</button>
      <button class="mbtn primary" data-ok>${editing?'Salvar':'Criar'}</button>
    </div>`);
  $('modal').querySelector('[data-x]').onclick=closeModal;
  const del=$('modal').querySelector('[data-del]');
  if(del) del.onclick=()=>{
    confirmModal('Excluir aquisição',`Remover "${aq.nome}" e todo o seu progresso? O playbook (template) permanece.`,()=>{
      const ix=AQS.findIndex(a=>a.id===aq.id); if(ix>=0)AQS.splice(ix,1);
      UI.aqId=AQS[0].id; saveAqs(); saveUi();
      renderAll(); toast('Aquisição removida');
    },true);
  };
  $('modal').querySelector('[data-ok]').onclick=()=>{
    const nome=$('aq_nome').value.trim(); if(!nome){ $('aq_nome').focus(); return; }
    const cnpj=$('aq_cnpj').value.trim(); const inicio=$('aq_inicio').value||todayISO();
    if(editing){ aq.nome=nome; aq.cnpj=cnpj; aq.inicio=inicio; }
    else{ const novo={id:uid(),nome,cnpj,inicio,status:{}}; AQS.push(novo); UI.aqId=novo.id; }
    saveAqs(); saveUi(); closeModal(); renderAll();
    toast(editing?'Aquisição atualizada':'Aquisição criada');
  };
  setTimeout(()=>$('aq_nome').focus(),60);
}

/* ============================================================
   BACKUP / EXPORT / IMPORT / CSV / PRINT / RESET
   ============================================================ */
function download(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function exportJSON(){
  const payload={ app:'playbook_adp_ma', schema:SCHEMA, exportedAt:new Date().toISOString(),
    master:MASTER, repos:REPOS, aquisicoes:AQS, ui:UI };
  download(`playbook_adp_backup_${todayISO()}.json`, JSON.stringify(payload,null,2), 'application/json');
  toast('Backup exportado');
}

function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const m=data.master, rp=data.repos, aq=data.aquisicoes||data.aqs;
      if(!Array.isArray(m)||!rp){ toast('Arquivo inválido'); return; }
      confirmModal('Restaurar backup','Isto substitui o playbook, as bases e as aquisições atuais. Continuar?',()=>{
        MASTER=seedIds(m);
        REPOS=rp; ['fornecedores','verbas','caminhos','licoes'].forEach(k=>{ if(!Array.isArray(REPOS[k]))REPOS[k]=[]; });
        AQS=Array.isArray(aq)&&aq.length?aq:[{id:uid(),nome:'Aquisição 1',cnpj:'',inicio:todayISO(),status:{}}];
        AQS.forEach(a=>{ if(!a.status)a.status={}; });
        UI=data.ui&&typeof data.ui==='object'?data.ui:{mode:'fases',repoTab:'fornecedores'};
        if(!AQS.some(a=>a.id===UI.aqId))UI.aqId=AQS[0].id;
        if(!MASTER.some(f=>f.id===UI.activePhase))UI.activePhase=MASTER[0].id;
        saveMaster();saveRepos();saveAqs();saveUi();
        renderAll(); toast('Backup restaurado');
      });
    }catch(e){ toast('Erro ao ler o arquivo'); }
  };
  r.readAsText(file);
}

function exportCSV(){
  const aq=activeAq();
  const sep=';';
  const head=['Fase Nº','Fase','Categoria','Criticidade','Ação','Detalhe','Caminho ADP','Lição','Responsável','Status','Nota desta aquisição'];
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' ')}"`;
  const lines=[head.map(q).join(sep)];
  MASTER.forEach(f=>(f.acoes||[]).forEach(a=>{
    const rec=stOf(a.id);
    lines.push([
      f.num, f.nome, (CATS[a.cat]||{}).nome||a.cat, (CRIT[a.crit]||{}).nome||a.crit,
      a.titulo, a.detalhe, a.adp, a.licao, a.resp, (STATUS[rec.st]||{}).nome||rec.st, rec.nota
    ].map(q).join(sep));
  }));
  const csv='\uFEFF'+lines.join('\r\n');
  const safe=(aq.nome||'aquisicao').replace(/[^\w\-]+/g,'_');
  download(`playbook_adp_${safe}_${todayISO()}.csv`, csv, 'text/csv;charset=utf-8;');
  toast('CSV exportado');
}

function resetPlaybook(){
  confirmModal('Restaurar playbook padrão','Volta o conteúdo do playbook e das bases ao modelo original. O progresso das aquisições é mantido. Continuar?',()=>{
    MASTER=seedIds(clone(DEFAULT_PLAYBOOK)); REPOS=clone(DEFAULT_REPOS);
    saveMaster(); saveRepos();
    if(!MASTER.some(f=>f.id===UI.activePhase))UI.activePhase=MASTER[0].id; saveUi();
    renderAll(); toast('Playbook restaurado ao padrão');
  });
}

/* ============================================================
   MOBILE — sidebar
   ============================================================ */
function openSidebarMobile(){ $('sidebar').classList.add('open'); $('backdrop').classList.add('show'); }
function closeSidebarMobile(){ $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); }

/* ============================================================
   LISTENERS GLOBAIS + INIT
   ============================================================ */
function wire(){
  // modos
  document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.mode==='fases'){} setMode(b.dataset.mode); }));
  // filtros / busca
  let searchT=null;
  $('searchInput').addEventListener('input',()=>{ clearTimeout(searchT); searchT=setTimeout(()=>{ renderActiveView(); renderSidebar(); },180); });
  $('filtCat').addEventListener('change',()=>{ renderActiveView(); });
  $('filtStatus').addEventListener('change',()=>{ renderActiveView(); });

  // aquisição
  $('aqSelect').addEventListener('change',e=>{ UI.aqId=e.target.value; saveUi(); renderAll(); });
  $('btnNewAq').addEventListener('click',()=>openAqModal(false));
  $('btnEditAq').addEventListener('click',()=>openAqModal(true));

  // backup
  $('btnExport').addEventListener('click',exportJSON);
  $('btnImport').addEventListener('click',()=>$('fileInput').click());
  $('fileInput').addEventListener('change',e=>{ if(e.target.files[0]){ importJSON(e.target.files[0]); e.target.value=''; } });
  $('btnCsv').addEventListener('click',exportCSV);
  $('btnPrint').addEventListener('click',()=>window.print());
  $('btnReset').addEventListener('click',resetPlaybook);

  // mobile
  $('menuToggle').addEventListener('click',()=>{ $('sidebar').classList.contains('open')?closeSidebarMobile():openSidebarMobile(); });
  $('backdrop').addEventListener('click',closeSidebarMobile);

  // modal: fechar ao clicar fora / ESC
  $('overlay').addEventListener('mousedown',e=>{ if(e.target===$('overlay')) closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

  // popular filtro de categorias
  const fc=$('filtCat');
  Object.keys(CATS).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=CATS[k].nome; fc.appendChild(o); });
}

document.addEventListener('DOMContentLoaded',()=>{
  bootState();
  wire();
  renderAll();
});

</script>
